name: Seven RPG Android APK

on:
  push:
    branches:
      - "apk/*"
  workflow_dispatch:

concurrency:
  group: seven-rpg-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Set up Node.js for browser parity tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test dependencies
        run: npm install --prefix web

      - name: Install Chromium for browser tests
        run: npx --prefix web playwright install --with-deps chromium

      - name: Test browser edition in Chromium
        run: npm --prefix web run test:e2e

      - name: Record APK checksum
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          else
            echo "APK not produced" | tee app-debug.sha256
          fi

      - name: Upload APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-rpg-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app-debug.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Publish tested preview release
        if: success() && github.ref == 'refs/heads/apk/release-2026-10-26'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview-2026-10-26
          name: Seven RPG v0.1.0 Preview — 26 Oct 2026
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated preview build. Android debug APK and SHA-256 checksum are attached.
            Android Gradle build, Android unit tests, and browser Chromium end-to-end tests must all pass before publication.
            This is a debug-signed preview, not a production-signed store release. A physical-device install/playtest has not been certified by CI.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          fail_on_unmatched_files: true
