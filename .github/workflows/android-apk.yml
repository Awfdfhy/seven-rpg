name: Seven RPG Android APK

on:
  push:
    branches:
      - "apk/*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Record APK checksum
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          else
            echo "APK not produced" | tee app-debug.sha256
          fi

      - name: Upload APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-rpg-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app-debug.sha256
          if-no-files-found: warn
          retention-days: 30
