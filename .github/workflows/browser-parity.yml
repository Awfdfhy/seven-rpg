name: Seven RPG Browser Parity
on:
  push:
    branches:
      - "web/*"
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seven-rpg-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --prefix web
      - run: npx --prefix web playwright install chromium
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-rpg-browser-test-report
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy-browser-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/web/playtest-verify-20261026'
    needs: browser-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy tested browser preview
        id: deployment
        uses: actions/deploy-pages@v4
