<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seven RPG — إجراء إجراء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      direction: rtl;
      text-align: right;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: var(--space-6);
    }

    /* Header */
    .screen-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border-bottom: var(--border-width-1) solid var(--color-border);
      margin-bottom: var(--space-6);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--color-primary-600);
      font-family: var(--font-body);
      font-size: var(--text-lg);
      cursor: pointer;
      padding: var(--space-2);
      border-radius: var(--radius-md);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      color: var(--color-primary-500);
      font-weight: var(--font-bold);
    }

    /* Main content */
    .main-content {
      flex: 1;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* Action form */
    .action-card {
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .form-group {
      margin-bottom: var(--space-5);
    }

    .form-label {
      display: block;
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      text-align: right;
    }

    .form-textarea {
      width: 100%;
      min-height: 120px;
      padding: var(--space-4);
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--border-color-light);
      border-radius: var(--radius-lg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      text-align: right;
      direction: rtl;
      resize: vertical;
    }

    .form-textarea:focus {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
      border-color: var(--color-primary-500);
    }

    .error-text {
      color: var(--color-error);
      font-size: var(--text-xs);
      margin-top: var(--space-2);
      text-align: right;
      display: none;
    }

    .error-text.visible {
      display: block;
    }

    .char-counter {
      font-size: var(--text-xs);
      color: var(--color-neutral-500);
      text-align: left;
      margin-top: var(--space-1);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--size-button-h-md);
      padding: 0 var(--space-6);
      border-radius: var(--radius-xl);
      border: var(--border-width-1) solid transparent;
      font-family: var(--font-body);
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .btn:focus-visible {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary-500);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-600);
      box-shadow: var(--shadow-lg);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--color-primary-600);
      border: var(--border-width-1) solid var(--color-primary-200);
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--color-primary-50);
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 23, 23, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: var(--z-modal);
    }

    .loading-overlay.visible {
      display: flex;
    }

    .spinner {
      width: var(--size-icon-lg);
      height: var(--size-icon-lg);
      border: var(--border-width-2) solid var(--color-neutral-300);
      border-top-color: var(--color-primary-500);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Response card */
    .response-card {
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      margin-top: var(--space-6);
      display: none;
    }

    .response-card.visible {
      display: block;
    }

    .response-label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
      text-align: right;
    }

    .response-text {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--color-text-primary);
      line-height: var(--leading-relaxed);
      white-space: pre-wrap;
    }

    /* Responsive */
    @media (max-width: 375px) {
      .page-container { padding: var(--space-4); }
      .action-card { padding: var(--space-4); }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="screen-header">
      <button class="btn-back" aria-label="العودة">←</button>
      <h1 class="screen-title">إجراء إجراء</h1>
    </header>

    <main class="main-content">
      <div class="action-card">
        <form id="action-form" novalidate>
          <div class="form-group">
            <label for="action-input" class="form-label">ما الذي تريد فعله؟</label>
            <textarea
              id="action-input"
              name="action-input"
              class="form-textarea"
              maxlength="200"
              placeholder="اكتب إجراءك هنا… (مثل: استكشف الغابة، تحدث إلى الحارس، افتح الصندوق)"
              required
              aria-required="true"
              aria-describedby="action-error"
            ></textarea>
            <div id="action-error" class="error-text" role="alert"></div>
            <div id="char-counter" class="char-counter">0 / 200</div>
          </div>
        </form>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="btn-cancel">إلغاء</button>
        <button class="btn btn-primary" id="btn-execute" disabled>تنفيذ</button>
      </div>

      <div class="response-card" id="response-card">
        <div class="response-label">استجابة اللعبة</div>
        <div class="response-text" id="response-text"></div>
      </div>
    </main>
  </div>

  <div class="loading-overlay" id="loading-overlay" role="status" aria-label="جاري تنفيذ الإجراء">
    <div class="spinner"></div>
  </div>

  <script>
    const form = document.getElementById('action-form');
    const actionInput = document.getElementById('action-input');
    const actionError = document.getElementById('action-error');
    const charCounter = document.getElementById('char-counter');
    const executeBtn = document.getElementById('btn-execute');
    const cancelBtn = document.getElementById('btn-cancel');
    const btnBack = document.getElementById('btn-back');
    const loading = document.getElementById('loading-overlay');
    const responseCard = document.getElementById('response-card');
    const responseText = document.getElementById('response-text');

    function validate() {
      const text = actionInput.value.trim();
      const len = text.length;
      charCounter.textContent = `${len} / 200`;
      executeBtn.disabled = len === 0 || len > 200;

      if (len === 0) {
        actionError.textContent = "الإجراء مطلوب";
        actionError.classList.add('visible');
      } else if (len > 200) {
        actionError.textContent = "الإجراء طويل جداً (أقصى 200 حرف)";
        actionError.classList.add('visible');
      } else {
        actionError.classList.remove('visible');
      }
    }

    actionInput.addEventListener('input', validate);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (executeBtn.disabled) return;

      const actionText = actionInput.value.trim();
      loading.classList.add('visible');
      executeBtn.disabled = true;

      // Simulate AI provider call
      await new Promise(r => setTimeout(r, 1500));

      loading.classList.remove('visible');

      // Show response
      responseText.textContent = `اللعاب تستجيب لإجراءك: "${actionText}". maga` ;
      responseCard.classList.add('visible');

      // Scroll to response
      responseCard.scrollIntoView({ behavior: 'smooth' });
    });

    cancelBtn.addEventListener('click', () => {
      console.log('[Seven RPG] Cancel action');
      // In real app: navigate to SceneEntry
    });

    btnBack.addEventListener('click', () => {
      console.log('[Seven RPG] Back to scene');
      // In real app: navigate to SceneEntry
    });

    // Keyboard accessibility
    [executeBtn, cancelBtn, btnBack].forEach(btn => {
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });

    // Initial validation
    validate();
  </script>
</body>
</html>
