<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seven RPG — إنشاء الشخصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      direction: rtl;
      text-align: right;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: var(--space-6);
    }

    /* Header */
    .screen-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border-bottom: var(--border-width-1) solid var(--color-border);
      margin-bottom: var(--space-6);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--color-primary-600);
      font-family: var(--font-body);
      font-size: var(--text-lg);
      cursor: pointer;
      padding: var(--space-2);
      border-radius: var(--radius-md);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      color: var(--color-primary-500);
      font-weight: var(--font-bold);
    }

    /* Main content */
    .main-content {
      flex: 1;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* Avatar section */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-preview {
      width: var(--size-avatar-lg);
      height: var(--size-avatar-lg);
      border-radius: var(--radius-full);
      background: var(--color-primary-100);
      border: var(--border-width-2) solid var(--color-primary-500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      color: var(--color-primary-700);
      margin-bottom: var(--space-3);
    }

    .avatar-label {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    /* Form card */
    .form-card {
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .form-group {
      margin-bottom: var(--space-5);
    }

    .form-label {
      display: block;
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      text-align: right;
    }

    .form-input {
      width: 100%;
      height: var(--size-button-h-md);
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--border-color-light);
      border-radius: var(--radius-lg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      text-align: right;
      direction: rtl;
    }

    .form-input:focus {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
      border-color: var(--color-primary-500);
    }

    .select-wrapper {
      position: relative;
    }

    .select-arrow {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      /* RTL: arrow points left on Arabic */
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid var(--color-neutral-600);
      pointer-events: none;
    }

    [dir="rtl"] .select-arrow {
      left: auto;
      right: var(--space-3);
      border-left: 6px solid var(--color-neutral-600);
      border-right: 6px solid transparent;
    }

    .class-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    .class-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4);
      border: var(--border-width-1) solid var(--border-color-light);
      border-radius: var(--radius-lg);
      background: var(--color-neutral-50);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
      touch-action: manipulation;
    }

    .class-option:hover {
      border-color: var(--color-primary-500);
      background: var(--color-primary-50);
    }

    .class-option.selected {
      border-color: var(--color-primary-500);
      background: var(--color-primary-100);
      box-shadow: var(--shadow-sm);
    }

    .class-icon {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-2);
    }

    .class-name {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-primary);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--size-button-h-md);
      padding: 0 var(--space-6);
      border-radius: var(--radius-xl);
      border: var(--border-width-1) solid transparent;
      font-family: var(--font-body);
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .btn:focus-visible {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary-500);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-600);
      box-shadow: var(--shadow-lg);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--color-primary-600);
      border: var(--border-width-1) solid var(--color-primary-200);
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--color-primary-50);
    }

    /* Responsive */
    @media (max-width: 375px) {
      .page-container { padding: var(--space-4); }
      .form-card { padding: var(--space-4); }
      .class-options { grid-template-columns: 1fr; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="screen-header">
      <button class="btn-back" aria-label="العودة">←</button>
      <h1 class="screen-title">إنشاء الشخصية</h1>
    </header>

    <main class="main-content">
      <!-- Avatar -->
      <div class="avatar-section">
        <div class="avatar-preview" id="avatar-preview">شخصية</div>
        <div class="avatar-label">صورة الشخصية</div>
      </div>

      <!-- Form -->
      <div class="form-card">
        <form id="character-form" novalidate>
          <div class="form-group">
            <label for="character-name" class="form-label">اسم الشخصية</label>
            <input
              type="text"
              id="character-name"
              name="character-name"
              class="form-input"
              maxlength="20"
              placeholder="أدخل اسم الشخصية…"
              required
              aria-required="true"
              aria-describedby="name-error"
            >
            <div id="name-error" class="error-text" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label">الفئة</label>
            <div class="class-options" role="radiogroup" aria-label="اختر الفئة">
              <div class="class-option selected" data-class="warrior" role="radio" aria-checked="true" tabindex="0">
                <div class="class-name">محارب</div>
              </div>
              <div class="class-option" data-class="mage" role="radio" aria-checked="false" tabindex="0">
                <div class="class-name">ساحر</div>
              </div>
              <div class="class-option" data-class="rogue" role="radio" aria-checked="false" tabindex="0">
                <div class="class-name">لص</div>
              </div>
            </div>
            <div id="class-error" class="error-text" role="alert"></div>
          </div>
        </form>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <button class="btn btn-ghost" id="btn-cancel">إلغاء</button>
        <button class="btn btn-primary" id="btn-create-character" disabled>
          إنشاء الشخصية
        </button>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('character-form');
    const characterName = document.getElementById('character-name');
    const nameError = document.getElementById('name-error');
    const classOptions = document.querySelectorAll('.class-option');
    const createBtn = document.getElementById('btn-create-character');
    const cancelBtn = document.getElementById('btn-cancel');
    const avatarPreview = document.getElementById('avatar-preview');

    const classIcons = {
      warrior: 'محارب',
      mage: 'ساحر',
      rogue: 'لص',
    };

    let selectedClass = 'warrior';

    // Class selection
    classOptions.forEach(option => {
      option.addEventListener('click', () => {
        classOptions.forEach(o => {
          o.classList.remove('selected');
          o.setAttribute('aria-checked', 'false');
        });
        option.classList.add('selected');
        option.setAttribute('aria-checked', 'true');
        selectedClass = option.dataset.class;
        avatarPreview.textContent = classIcons[selectedClass] || 'شخصية';
        validate();
      });

      // Keyboard accessibility
      option.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          option.click();
        }
      });
    });

    function validate() {
      const name = characterName.value.trim();
      const isValid = name.length > 0 && name.length <= 20 && selectedClass;
      createBtn.disabled = !isValid;

      if (name.length === 0) {
        nameError.textContent = "اسم الشخصية مطلوب";
        nameError.classList.add('visible');
      } else if (name.length > 20) {
        nameError.textContent = "اسم الشخصية طويل جداً (أقصى 20 حرف)";
        nameError.classList.add('visible');
      } else {
        nameError.classList.remove('visible');
      }
    }

    characterName.addEventListener('input', validate);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (createBtn.disabled) return;

      console.log('[Seven RPG] Character created:', {
        name: characterName.value.trim(),
        class: selectedClass,
      });
      // In real app: navigate to SceneEntry
    });

    cancelBtn.addEventListener('click', () => {
      console.log('[Seven RPG] Cancel character creation');
      // In real app: navigate to WorldCreation
    });

    // Keyboard accessibility for buttons
    [createBtn, cancelBtn].forEach(btn => {
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });

    // Initial validation
    validate();
  </script>
</body>
</html>
