<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seven RPG — إطلاق اللعبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    /* Launch Screen — Seven RPG */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      direction: rtl;
      text-align: right;
      -webkit-tap-highlight-color: transparent;
    }

    .launch-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: linear-gradient(135deg, var(--color-neutral-50) 0%, var(--color-neutral-100) 100%);
    }

    @media (prefers-color-scheme: dark) {
      .launch-container {
        background: linear-gradient(135deg, var(--color-fantasy-shadow-realm) 0%, #1e293b 100%);
      }
    }

    /* Logo */
    .launch-logo {
      font-family: var(--font-display);
      font-size: var(--text-6xl);
      font-weight: var(--font-extrabold);
      color: var(--color-primary-500);
      text-shadow: 0 0 20px rgba(217, 70, 239, 0.3);
      margin-bottom: var(--space-12);
      animation: pulse-gold 3s ease-in-out infinite;
      text-align: center;
    }

    /* Buttons stack */
    .launch-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      width: 100%;
      max-width: var(--size-button-h-lg);
      /* max-width hack for button width control — replaced below */
    }

    .launch-buttons > * {
      width: 100%;
    }

    /* Buttons — using design tokens */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--size-button-h-md);
      padding: 0 var(--space-6);
      border-radius: var(--radius-xl);
      border: var(--border-width-1) solid transparent;
      font-family: var(--font-body);
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .btn:focus-visible {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary-500);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-600);
      box-shadow: var(--shadow-lg);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--color-primary-600);
      border: var(--border-width-1) solid var(--color-primary-200);
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--color-primary-50);
    }

    .btn-fantasy-gold {
      background-color: var(--color-fantasy-gold);
      color: var(--color-neutral-900);
      font-weight: var(--font-bold);
      box-shadow: var(--shadow-fantasy-glow);
      animation: pulse-gold 3s ease-in-out infinite;
    }

    .btn-fantasy-gold:hover:not(:disabled) {
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
    }

    /* Error state */
    .error-text {
      color: var(--color-error);
      font-size: var(--text-sm);
      margin-top: var(--space-2);
      text-align: center;
    }

    /* Loading spinner */
    .spinner {
      width: var(--size-icon-md);
      height: var(--size-icon-md);
      border: var(--border-width-2) solid var(--color-neutral-300);
      border-top-color: var(--color-primary-500);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 375px) {
      .launch-logo { font-size: var(--text-5xl); }
      .launch-buttons { max-width: 100%; }
    }

    @media (min-width: 768px) {
      .launch-logo { font-size: var(--text-6xl); }
      .launch-buttons { max-width: 400px; flex-direction: row; }
      .launch-buttons > * { width: auto; }
    }
  </style>
</head>
<body>
  <div class="launch-container">
    <h1 class="launch-logo">Seven RPG</h1>

    <div class="launch-buttons" role="group" aria-label="خيارات اللعبة الرئيسية">
      <button class="btn btn-primary touch-target" id="btn-new-game">
        بدء لعبة جديدة
      </button>
      <button class="btn btn-ghost touch-target" id="btn-load-save">
        تحميل حفظ
      </button>
    </div>

    <div id="error-message" class="error-text" role="alert" aria-live="polite" style="display:none;">
      حدث خطأ أثناء تحميل اللعبة. يرجى المحاولة مرة أخرى.
    </div>

    <div id="loading" class="spinner" style="display:none; margin-top: var(--space-6);" role="status" aria-label="جاري التحميل"></div>
  </div>

  <script>
    // Directive: codex-fable5 — verify before completion; evidence-first.
    // No API calls, no secrets. Pure frontend demonstration.

    const btnNewGame = document.getElementById('btn-new-game');
    const btnLoadSave = document.getElementById('btn-load-save');
    const errorMsg = document.getElementById('error-message');
    const loading = document.getElementById('loading');

    function setLoading(isLoading) {
      loading.style.display = isLoading ? 'block' : 'none';
      btnNewGame.disabled = isLoading;
      btnLoadSave.disabled = isLoading;
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
    }

    btnNewGame.addEventListener('click', async () => {
      setLoading(true);
      errorMsg.style.display = 'none';
      // Simulate async action — MVP-0 pattern: loading → success/error
      await new Promise(r => setTimeout(r, 800));
      setLoading(false);
      // In real app: navigate to WorldCreation
      console.log('[Seven RPG] New Game clicked — navigate to WorldCreation');
    });

    btnLoadSave.addEventListener('click', async () => {
      setLoading(true);
      errorMsg.style.display = 'none';
      await new Promise(r => setTimeout(r, 800));
      setLoading(false);
      // In real app: load existing save or show empty state
      console.log('[Seven RPG] Load Save clicked');
    });

    // Keyboard accessibility: Enter/Space on focused button
    [btnNewGame, btnLoadSave].forEach(btn => {
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });
  </script>
</body>
</html>
