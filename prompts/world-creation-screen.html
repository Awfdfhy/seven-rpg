<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seven RPG — إنشاء العالم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      direction: rtl;
      text-align: right;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: var(--space-6);
    }

    /* Header */
    .screen-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border-bottom: var(--border-width-1) solid var(--color-border);
      margin-bottom: var(--space-6);
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--color-primary-600);
      font-family: var(--font-body);
      font-size: var(--text-lg);
      cursor: pointer;
      padding: var(--space-2);
      border-radius: var(--radius-md);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .btn-back:hover:not(:disabled) {
      background: var(--color-primary-50);
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      color: var(--color-primary-500);
      font-weight: var(--font-bold);
    }

    /* Main content */
    .main-content {
      flex: 1;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .form-card {
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      margin-bottom: var(--space-6);
    }

    .form-group {
      margin-bottom: var(--space-5);
    }

    .form-label {
      display: block;
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      text-align: right;
    }

    .form-input {
      width: 100%;
      height: var(--size-button-h-md);
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border: var(--border-width-1) solid var(--border-color-light);
      border-radius: var(--radius-lg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      text-align: right;
      direction: rtl;
    }

    .form-input:focus {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
      border-color: var(--color-primary-500);
    }

    .form-input::placeholder {
      color: var(--color-neutral-500);
    }

    .error-text {
      color: var(--color-error);
      font-size: var(--text-xs);
      margin-top: var(--space-2);
      text-align: right;
      display: none;
    }

    .error-text.visible {
      display: block;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--size-button-h-md);
      padding: 0 var(--space-6);
      border-radius: var(--radius-xl);
      border: var(--border-width-1) solid transparent;
      font-family: var(--font-body);
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
      touch-action: manipulation;
      min-height: var(--a11y-min-touch);
    }

    .btn:focus-visible {
      outline: var(--a11y-focus-ring);
      outline-offset: var(--a11y-focus-offset);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary-500);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-600);
      box-shadow: var(--shadow-lg);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--color-primary-600);
      border: var(--border-width-1) solid var(--color-primary-200);
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--color-primary-50);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 23, 23, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: var(--z-modal);
    }

    .loading-overlay.visible {
      display: flex;
    }

    .spinner {
      width: var(--size-icon-lg);
      height: var(--size-icon-lg);
      border: var(--border-width-2) solid var(--color-neutral-300);
      border-top-color: var(--color-primary-500);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 375px) {
      .page-container { padding: var(--space-4); }
      .form-card { padding: var(--space-4); }
      .btn-row { flex-direction: column; }
    }

    @media (prefers-color-scheme: dark) {
      .form-input {
        border-color: var(--border-color-dark);
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="screen-header">
      <button class="btn-back" aria-label="العودة">←</button>
      <h1 class="screen-title">إنشاء عالم جديد</h1>
    </header>

    <main class="main-content">
      <div class="form-card">
        <form id="world-form" novalidate>
          <div class="form-group">
            <label for="world-name" class="form-label">اسم العالم</label>
            <input
              type="text"
              id="world-name"
              name="world-name"
              class="form-input"
              maxlength="30"
              placeholder="أدخل اسم العالم…"
              required
              aria-required="true"
              aria-describedby="world-name-error"
            >
            <div id="world-name-error" class="error-text" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label">نوع العالم</label>
            <select id="world-type" class="form-input">
              <option value="fantasy">عالم خيالي (Fantasy)</option>
              <option value="scifi">عالم خيال علمي (Sci-Fi)</option>
              <option value="historical">عالم تاريخي (Historical)</option>
            </select>
          </div>
        </form>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="btn-cancel">إلغاء</button>
        <button class="btn btn-primary" id="btn-create-world" disabled>
          إنشاء العالم
        </button>
      </div>
    </main>
  </div>

  <div class="loading-overlay" id="loading-overlay" role="status" aria-label="جاري إنشاء العالم">
    <div class="spinner"></div>
  </div>

  <script>
    const form = document.getElementById('world-form');
    const worldName = document.getElementById('world-name');
    const errorDiv = document.getElementById('world-name-error');
    const createBtn = document.getElementById('btn-create-world');
    const cancelBtn = document.getElementById('btn-cancel');
    const loading = document.getElementById('loading-overlay');

    function validate() {
      const name = worldName.value.trim();
      const isValid = name.length > 0 && name.length <= 30;
      createBtn.disabled = !isValid;

      if (name.length === 0) {
        errorDiv.textContent = "اسم العالم مطلوب";
        errorDiv.classList.add('visible');
      } else if (name.length > 30) {
        errorDiv.textContent = "اسم العالم طويل جداً (أقصى 30 حرف)";
        errorDiv.classList.add('visible');
      } else {
        errorDiv.classList.remove('visible');
      }
    }

    worldName.addEventListener('input', validate);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (createBtn.disabled) return;

      loading.classList.add('visible');
      createBtn.disabled = true;

      // Simulate async save
      setTimeout(() => {
        loading.classList.remove('visible');
        console.log('[Seven RPG] World created:', worldName.value.trim());
        // In real app: navigate to CharacterCreation
      }, 1000);
    });

    cancelBtn.addEventListener('click', () => {
      console.log('[Seven RPG] Cancel world creation');
      // In real app: navigate to Launch
    });

    // Keyboard accessibility
    [createBtn, cancelBtn].forEach(btn => {
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });

    // Initial validation
    validate();
  </script>
</body>
</html>
