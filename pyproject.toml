[project]
name = "seven-rpg"
version = "0.1.0"
description = "Seven RPG — Mobile-first AI-powered RPG (greenfield bootstrap)"
requires-python = ">=3.11"
authors = [
    {name = "Seven RPG Team", email = "dev@seven-rpg.local"},
]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]
agent = [
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
]

[project.scripts]
seven-rpg = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "Q", "S", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true